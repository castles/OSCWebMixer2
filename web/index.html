<!DOCTYPE html>
<html lang="en">
  <head>
    <title>EarsMixer</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EarsMixer" />
    <meta name="theme-color" content="#191c21" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />
    <link rel="stylesheet" href="mixer.min.css?v=2.8.0" />
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/images/apple-touch-icon-57x57.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="/images/apple-touch-icon-72x72.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="/images/apple-touch-icon-76x76.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="/images/apple-touch-icon-114x114.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/images/apple-touch-icon-120x120.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/images/apple-touch-icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/images/apple-touch-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon-180x180.png"
    />
    <link rel="apple-touch-startup-image" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="disconnected">
    <header id="mix">
      <div class="mixer-brand"><img src="/images/Glow_Logo_2026.svg" alt="Glow"><span>EarsMixer</span><span id="snapshot" class="snapshot-name" hidden></span></div>
      <div class="mixer-header-controls"><label class="mix-choice"><span>Your mix</span><select id="aux" aria-label="Your AUX mix" disabled></select></label></div>
    </header>
    <div class="mixer-toolbar">
      <span id="mixerStatus" class="mixer-status" role="status" aria-live="polite">Connecting…</span>
    </div>
    <div id="mixerControls" class="mixer-controls">
      <div id="controlsBackdrop" class="controls-backdrop" hidden></div>
      <button id="controlsToggle" class="controls-toggle" type="button" aria-expanded="false" aria-controls="controlsFan" aria-label="Open mixer controls" title="Mixer controls"><svg class="app-icon controls-open-icon" aria-hidden="true"><use href="vendor/lucide.svg#slidersHorizontal"></use></svg><svg class="app-icon controls-close-icon" aria-hidden="true"><use href="vendor/lucide.svg#x"></use></svg></button>
      <div id="controlsFan" class="controls-fan" role="group" aria-label="Mixer controls" inert>
        <div class="fan-action fan-fullscreen">
          <button id="enterFullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#maximize"></use></svg><span>Full screen</span></button>
          <button id="exitFullscreen" type="button" aria-label="Exit fullscreen" title="Exit fullscreen" hidden><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#minimize"></use></svg><span>Exit fullscreen</span></button>
        </div>
        <button id="zeroAllChannels" class="fan-action fan-zero" type="button" disabled title="Set every enabled channel in this AUX mix to 0 dB, including channels hidden by Favourites"><strong>0 dB</strong><span>Set all to 0</span></button>
        <button id="compactMode" class="fan-action fan-compact" type="button" aria-pressed="false"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#moveHorizontal"></use></svg><span>Compact</span></button>
        <label class="favourites-toggle fan-action fan-favourites"><input id="favourites" type="checkbox"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#star"></use></svg><span>Favourites</span></label>
        <button id="editLayout" class="fan-action fan-edit" type="button" aria-pressed="false" disabled><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#pencil"></use></svg><span>Edit layout</span></button>
        <button id="panMode" class="fan-action fan-pan" type="button" aria-pressed="false"><strong>Pan</strong></button>
        <button id="editNickname" class="fan-action fan-nickname" type="button" title="Nickname" aria-label="Set nickname"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#userRound"></use></svg><span id="nicknameLabel">Nickname</span></button>
        <div class="view-toggle" role="group" aria-label="Channel view">
          <button id="listView" type="button" aria-label="List view" title="List view" aria-pressed="true"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#list"></use></svg></button>
          <button id="gridView" type="button" aria-label="Grid view" title="Grid view" aria-pressed="false"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#grid2x2"></use></svg></button>
        </div>
      </div>
    </div>
    <div id="layoutEditor" class="layout-editor" role="region" aria-label="Layout editing" hidden>
      <div><strong>Editing layout</strong><p id="layoutHint">Drag to reorder.</p></div>
      <button id="doneLayout" type="button"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#check"></use></svg>Done</button>
    </div>
    <main id="channelsWrap" aria-label="Mix channels">
      <div id="channels"></div>
      <p id="emptyChannels" hidden>No favourites yet. Turn off Favourites to star channels.</p>
    </main>
    <dialog id="nicknameDialog" class="settings-dialog" aria-labelledby="nicknameTitle">
      <div class="settings-dialog-header"><h2 id="nicknameTitle">Nickname</h2><button id="closeNickname" type="button" aria-label="Close nickname"><svg class="app-icon" aria-hidden="true"><use href="vendor/lucide.svg#x"></use></svg></button></div>
      <form id="nicknameForm" class="settings-section">
        <label for="nickname">Nickname</label><input id="nickname" maxlength="80" autocomplete="nickname">
        <p id="nicknameError" class="settings-detail" role="alert"></p>
        <div class="dialog-actions"><button type="submit">Done</button><button id="skipNickname" type="button" hidden>Skip</button></div>
      </form>
    </dialog>
    <script src="vendor/Sortable.min.js"></script>
    <script src="icons.js"></script>
    <script src="identity.js?v=2.8.0"></script>
    <script src="mixer.min.js?v=2.8.0"></script>
  </body>
</html>
