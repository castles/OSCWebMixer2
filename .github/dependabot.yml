version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"           # root of your project
    schedule:
      interval: "daily"      # check for updates daily
    ignore:
      - dependency-name: "osc"
        versions: ["*"]      # ignore npm registry versions, use your GitHub fork
      - dependency-name: "ora"
        update-types: ["version-update:semver-major"]  # ora >=6 is ESM-only; this project is CommonJS
